<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Hatch">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <!-- theme-color: --chrome (tokens.css) - the top bar's own ground, light and dark -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0052a3">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f2f6b">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Hatch</title>
    <!--
      Fires before the module script below is even fetched, so a failure to
      load/parse/execute main.tsx (bad deploy, MIME mismatch, syntax error)
      still leaves a trace in the logs instead of just a blank screen.
      Kept as plain inline JS (no build step touches this file's script tags).
    -->
    <script>
      (function () {
        try {
          window.__uiLogSessionId = crypto.randomUUID();
          var body = JSON.stringify([{
            app: 'hatch',
            level: 'info',
            message: 'hatch index.html parse started',
            timestamp: new Date().toISOString(),
            sessionId: window.__uiLogSessionId,
            url: location.href,
            metadata: { userAgent: navigator.userAgent },
          }]);
          fetch('/api/ui-logs', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: body,
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
