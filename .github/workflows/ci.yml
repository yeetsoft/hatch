name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    # A job that has stopped making progress should cost a coffee break, not
    # an afternoon: GitHub's default is six hours, and these are several times
    # what each of these takes on a green run.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # Hatch's claim (docs/hatch.md, "Claim") is built out of conditional
      # UPDATEs, and its tests skip when this is unset - which keeps
      # `make test-api` runnable on a laptop with no Postgres, and makes this
      # variable the difference between the claim's guarantee being *asserted*
      # here and merely being assertable. See
      # src/Hatch.Api.Tests/Hatch/HatchDatabase.cs for why the tests demand an
      # explicit database rather than discovering one: they drop what they
      # connect to.
      HATCH_TEST_DATABASE_URL: postgresql://hatch:hatch@localhost:5432/hatch_test
    # A real Postgres, because the claim is a Postgres statement. Whether a
    # conditional UPDATE matches one row or zero is what decides which of two
    # runners holds a ticket, and EF's in-memory provider refuses the statement
    # outright while SQLite cannot translate the DateTimeOffset comparison the
    # expiry rule is. Either substitute would pass while the SQL was wrong,
    # which is the one failure mode this service exists to prevent.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hatch
          POSTGRES_PASSWORD: hatch
          POSTGRES_DB: hatch_test
        ports:
          - 5432:5432
        # Without this the test step can start before the server accepts
        # connections, which reads as a flaky suite rather than as a race in
        # this file.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The runner's apt postgresql-client is older than the postgres:18 service,
      # and the restore-drill test (BackupRestoreDrillTests) skips on any major
      # mismatch between pg_dump/psql and the server. PGDG's own apt setup script
      # is the route: it adds only the source the runner lacks, so it cannot
      # collide with a pgdg source the image already carries. The image's own
      # PostgreSQL 16 pg_dump is ahead of the new one on PATH, so the 18 bin
      # directory is put first for every later step, dotnet test included.
      - name: Install postgresql-client-18 (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y # ethos:allow - PGDG's script name, not a host
          sudo apt-get install -y postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      # A separate step: $GITHUB_PATH only takes effect from the next step on.
      - name: Show the pg_dump and psql the tests will see
        run: |
          command -v pg_dump
          pg_dump --version
          psql --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Hatch.slnx

      - name: Build
        run: dotnet build src/Hatch.slnx --no-restore --configuration Release

      # The solution, so this one step covers both suites: Hatch.Api.Tests
      # against the Postgres above, and Hatch.Cli.Tests - the runner behind
      # `hatch.sh work` and `hatch.sh go-to-work` - which needs neither a
      # database nor a network, since its wire and its sessions are stubs.
      #
      # A test that stops making progress is killed at two minutes and named,
      # rather than spending the job's whole timeout in silence - which is how
      # HA-171's hang looked: the Cli suite reported, then nothing for fourteen
      # minutes. The dump of every thread it leaves is uploaded below.
      - name: Test
        run: |
          dotnet test src/Hatch.slnx --no-build --configuration Release \
            --blame-hang-timeout 2m \
            --blame-hang-dump-type mini \
            --results-directory "${{ runner.temp }}/test-results"

      # Only on failure, and only if there is anything: a green run leaves no
      # dump, and a red one that did not hang leaves nothing worth keeping.
      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # The shippable `hatch`, for every platform this house runs on.
  #
  # A cross-compiled, trimmed, self-contained publish is the one build that can
  # break without any test noticing: trimming decides what to keep by static
  # analysis, and a reflection path it could not see fails at runtime on the
  # operator's machine and nowhere before it. So all four are built on every PR,
  # in a matrix that names which RID broke rather than surfacing as a puzzling
  # failure in whichever happened to run first.
  #
  # Every RID cross-compiles from ubuntu: `dotnet publish --runtime` needs only
  # the target's runtime pack, not the target's operating system. Running the
  # result is a different question, and one the tests above already answer on
  # this platform.
  hatch-cli:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, osx-arm64, osx-x64, linux-x64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The same command `make publish-hatch` runs for one RID. Named here
      # rather than shelling out to make, so the matrix leg is the unit that
      # fails and the log says which platform it was.
      - name: Publish
        run: |
          dotnet publish src/Hatch.Cli/Hatch.Cli.csproj \
            --runtime ${{ matrix.rid }} \
            --configuration Release \
            --output artifacts/hatch/${{ matrix.rid }} \
            -p:PublishSingleFile=true \
            -p:SelfContained=true \
            -p:PublishTrimmed=true

      # A publish that produced no binary, or produced one under the old
      # `hatch-runner` name, is a green step and a broken artifact otherwise.
      - name: Check the binary is there, and is called hatch
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            win-*) binary="artifacts/hatch/${{ matrix.rid }}/hatch.exe" ;;
            *)     binary="artifacts/hatch/${{ matrix.rid }}/hatch" ;;
          esac
          test -f "$binary" || { echo "no $binary was published"; ls -R artifacts/hatch; exit 1; }
          ls -lh "$binary"

  web:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [auth, design, hatch, site]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Hatch.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Hatch.Web/package-lock.json

      # Hatch.Web is one npm workspace, so the install is the whole workspace's
      # and every job pays for it. That redundancy is bought deliberately: the
      # matrix is what makes a PR check say *which* app broke, and a job per app
      # is worth more than the minutes a single job would save.
      - name: Install dependencies
        working-directory: src/Hatch.Web
        run: npm ci

      - name: Lint
        working-directory: src/Hatch.Web
        run: npm run lint -w apps/${{ matrix.app }}

      - name: Test
        working-directory: src/Hatch.Web
        run: npm run test --if-present -w apps/${{ matrix.app }}

      - name: Build
        working-directory: src/Hatch.Web
        run: npm run build -w apps/${{ matrix.app }}

  # The board, rendered in a real headless Chromium, on every PR.
  #
  # HA-1043's smoke (src/Hatch.Api.Tests/E2e) already runs inside the api job,
  # where it skips - no browser, no bundle - and a skipped case is a green job.
  # So here it is a job of its own, with the browser installed and the hatch
  # bundle built, and a step after the test that fails the job unless every case
  # that matched actually passed. Its own job, rather than two more steps in
  # api, so the red check names a rendering rather than a unit test and the api
  # job's time stays what it is.
  #
  # No cache for Playwright's download: `--with-deps` installs apt packages
  # outside any directory worth caching, so the step runs on a hit as well and
  # the saving would be the download alone - against a key derived from the
  # package version and one more thing to go stale. Revisit if the download
  # turns out to dominate the job.
  e2e:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      # The same variable, and the same stock image, as the api job. The harness
      # makes its own scratch databases with CREATE DATABASE (MinimalDatabases),
      # which the image's POSTGRES_USER, a superuser, is allowed to; the image
      # needs nothing from containers/hatch-db.
      HATCH_TEST_DATABASE_URL: postgresql://hatch:hatch@localhost:5432/hatch_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hatch
          POSTGRES_PASSWORD: hatch
          POSTGRES_DB: hatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Hatch.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Hatch.Web/package-lock.json

      # Before the dotnet build, for two reasons. The hatch bundle lands in
      # src/Hatch.Api/wwwroot/apps/hatch, which is gitignored and which no
      # MSBuild target produces (Hatch.Api.csproj builds design and auth, and
      # deliberately not hatch). And that csproj's NpmInstall target only runs
      # when Hatch.Web/node_modules is missing, so installing first keeps the
      # build from shelling out to an `npm install` on whatever Node the runner
      # image carries.
      - name: Install dependencies
        working-directory: src/Hatch.Web
        run: npm ci

      - name: Build the hatch bundle
        working-directory: src/Hatch.Web
        run: npm run build -w apps/hatch

      - name: Restore
        run: dotnet restore src/Hatch.Api.Tests/Hatch.Api.Tests.csproj

      # The test project, which pulls Hatch.Api in with it; the Cli suite is the
      # api job's business. The design and auth targets run before every build
      # and would build two SPAs this job never serves.
      - name: Build
        run: |
          dotnet build src/Hatch.Api.Tests/Hatch.Api.Tests.csproj \
            --no-restore --configuration Release \
            -p:SkipDesignBuild=true -p:SkipAuthBuild=true

      # After the build, because the installer is copied beside the test binary
      # by the Playwright package itself. Chromium and WebKit, as `make
      # browsers` installs them; --with-deps for the shared libraries a bare
      # runner lacks. The browser is the one Playwright puts there, not one the
      # runner image happens to carry.
      - name: Install browsers
        run: pwsh src/Hatch.Api.Tests/bin/Release/net10.0/playwright.ps1 install chromium webkit --with-deps

      # Same hang clamp as the api job. The trx is what the next step reads.
      - name: Test
        run: |
          dotnet test src/Hatch.Api.Tests/Hatch.Api.Tests.csproj \
            --no-build --configuration Release \
            --filter "FullyQualifiedName~E2e" \
            --blame-hang-timeout 2m \
            --blame-hang-dump-type mini \
            --logger "trx;LogFileName=e2e.trx" \
            --results-directory "${{ runner.temp }}/test-results"

      # `dotnet test` exits 0 for a filtered run whose only case skipped - no
      # browser, no database - and the trx counts that as neither executed nor
      # passed. So read the counters: at least one case passed, and every case
      # the filter matched is one of them. A red Test step has already failed
      # the job, so this one only runs after a clean exit.
      - name: Check that the cases ran, and passed
        run: |
          set -euo pipefail
          counters=$(grep -m1 -o '<Counters [^>]*>' "${{ runner.temp }}/test-results/e2e.trx")
          echo "$counters"
          total=$(grep -o ' total="[0-9]*"' <<<"$counters" | grep -o '[0-9]*')
          passed=$(grep -o ' passed="[0-9]*"' <<<"$counters" | grep -o '[0-9]*')
          if [ "$passed" -lt 1 ] || [ "$passed" -ne "$total" ]; then
            echo "Only $passed of $total e2e cases passed: a skip is not a pass here."
            exit 1
          fi

      # The harness leaves its screenshot and trace under the repository, not
      # under --results-directory, so both places are named. Only on failure: a
      # green run leaves nothing worth keeping.
      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            src/Hatch.Api.Tests/TestResults/e2e/
            ${{ runner.temp }}/test-results
          if-no-files-found: ignore

  # Proves the image `publish.yml` builds after every merge to main actually
  # builds, and that gh - the thing src/Hatch.Cli/Forge.cs shells out to
  # inside it - is really on PATH and runs, on a PR rather than only after one
  # lands.
  hatch-runner-image:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the runner image
        run: docker build -f containers/hatch-runner/Dockerfile -t hatch-runner:ci .

      - name: gh is on PATH and runs
        run: docker run --rm --entrypoint gh hatch-runner:ci --version

  # One job that depends on every other, so a merge gate has exactly one
  # check to name instead of one per job (and one per matrix leg).
  ci:
    name: CI
    if: always()
    needs: [api, hatch-cli, web, e2e, hatch-runner-image]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "At least one required job failed."
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "At least one required job was cancelled."
            exit 1
          fi
